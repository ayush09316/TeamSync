name: CI/CD Pipeline

on:
  push:
    branches:
      - main # Prod
      - "release/*" # Staging
      - dev # Dev
  pull_request:
    branches:
      - main
      - "release/*"
      - dev

jobs:
  # Install Dependencies, Lint, and Test
  install_and_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8.x

      - name: Install dependencies
        run: pnpm install

      - name: Run lint
        run: pnpm lint
        continue-on-error: false

      - name: Build Application
        run: pnpm build

  # Deploy to Environment (Dev, Staging, Prod)
deploy:
  runs-on: ubuntu-latest
  needs: install_and_test
  steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up environment variables
      id: set_env
      run: |
        case $GITHUB_REF in
          "refs/heads/main") ENV="production" ;;
          "refs/heads/release/"*) ENV="staging" ;;
          "refs/heads/dev") ENV="development" ;;
        esac
        echo "ENV=$ENV" >> $GITHUB_ENV
        echo "::set-output name=env::$ENV"

    - name: Deploy to Vercel
      run: |
        if [[ $ENV == "production" ]]; then
          vercel deploy --prod --token ${{ secrets.VERCEL_TOKEN }}
        else
          vercel deploy --token ${{ secrets.VERCEL_TOKEN }}
        fi

  # Slack Notification (Optional)
  slack_notify:
    runs-on: ubuntu-latest
    needs: deploy
    if: ${{ needs.deploy.outputs.environment != 'development' }}
    steps:
      - name: Notify Slack
        uses: slackapi/slack-github-action@v1.22.0
        with:
          slack_token: ${{ secrets.SLACK_TOKEN }}
          channel_id: ${{ secrets.SLACK_CHANNEL_ID }}
          text: >
            CI/CD Pipeline Status: ${{ job.status }} -
            Branch: ${{ github.ref_name }} -
            Environment: ${{ needs.deploy.outputs.environment }}
