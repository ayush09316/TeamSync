name: CI/CD Pipeline

on:
  push:
    branches:
      - main           # Prod
      - 'release/*'    # Staging
      - dev            # Dev
  pull_request:
    branches:
      - main
      - 'release/*'
      - dev

jobs:
  # Install Dependencies, Lint, and Test
  install_and_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8.x

      - name: Install dependencies
        run: pnpm install

      - name: Run lint
        run: pnpm lint

  # Deploy to Environment (Dev, Staging, Prod)
  deploy:
    runs-on: ubuntu-latest
    needs: docker_build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up environment variables
        run: |
          if [[ $GITHUB_REF == 'refs/heads/main' ]]; then
            echo "Deploying to production"
            echo "ENV=production" >> $GITHUB_ENV
            echo "DOCKER_TAG=my-app:${{ github.sha }}" >> $GITHUB_ENV
          elif [[ $GITHUB_REF == 'refs/heads/release/*' ]]; then
            echo "Deploying to staging"
            echo "ENV=staging" >> $GITHUB_ENV
            echo "DOCKER_TAG=my-app:staging-${{ github.sha }}" >> $GITHUB_ENV
          elif [[ $GITHUB_REF == 'refs/heads/dev' ]]; then
            echo "Deploying to development"
            echo "ENV=development" >> $GITHUB_ENV
            echo "DOCKER_TAG=my-app:dev-${{ github.sha }}" >> $GITHUB_ENV
          fi

      - name: Deploy Docker image
        run: |
          echo "Deploying ${DOCKER_TAG} to ${ENV} environment"
          # You can add your specific deploy command for each environment here
          # Example: kubectl apply or any cloud provider commands depending on your setup

  # Slack Notification (Optional)
  slack_notify:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Notify Slack
        uses: slackapi/slack-github-action@v1.22.0
        with:
          slack_token: ${{ secrets.SLACK_TOKEN }}
          channel_id: ${{ secrets.SLACK_CHANNEL_ID }}
          text: 'CI/CD Pipeline Status: ${{ job.status }} - Deployed to ${{ env.ENV }} environment'
